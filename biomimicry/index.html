<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)" />
  <title>Biomimicry | Iterative Studio</title>
  <meta name="description" content="Biomimicry at Iterative Studio: learning from living systems for architecture and the built environment." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=0.3.02" />
  <link rel="stylesheet" href="/assets/white.css?v=0.2.02" />
  <style>
    .dev-note{
      margin:22px 0 0;
      padding:16px 18px;
      max-width:42rem;
      border:1px dashed var(--line);
      border-radius:var(--radius2);
      background:var(--panel2);
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }
  </style>
</head>

<body class="page-white">
  <header class="site-header">
    <div class="header-bar" aria-hidden="true"></div>
    <div class="header-inner">
      <div class="header-left">
        <a class="brand" href="/">
          <span class="brand-mark">[i]</span>
          <span class="brand-name header-link">Iterative Studio</span>
        </a>
      </div>
      <div class="header-hole" aria-hidden="true"></div>
      <div class="header-right">
        <nav class="nav">
          <a class="header-link" href="/biomimicry/" id="navBiomimicry">Biomimicry</a>
          <a class="header-link" href="/projects/" id="navProjects">Projects</a>
          <a class="header-link" href="/about/" id="navAbout">About</a>
          <a class="header-link" href="/contact/" id="navContact">Contact</a>
          <button class="lang-toggle" id="langToggle" type="button" aria-label="Language toggle">
            <span class="lang-top">EN</span>
            <span class="lang-divider"></span>
            <span class="lang-bottom">中文</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-inner">
        <p class="page-back">
          <a class="page-back-link" href="/" id="backLink">← Practical AI for the built environment</a>
        </p>
        <p class="kicker" id="kickerText">Biomimicry</p>
        <h1 id="heroTitle">Biomimicry</h1>
        <p class="lead" id="heroLead">Biomimicry page coming next.</p>
        <p class="dev-note" id="devNote">More to come.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <div class="footer-brand">© Iterative Studio</div>
        <div class="footer-note" id="footerNote">Biomimicry</div>
        <div class="footer-version" id="buildVersion">Build: v0.1.01</div>
      </div>
      <div class="footer-mark" aria-hidden="true">[i]</div>
      <div class="footer-right">
        <p class="footer-map-credit" id="footerTagline">Systems-first workflows for architecture and the built environment.</p>
      </div>
    </div>
  </footer>

  <script>
const BUILD = "v0.1.01";
const i18n = {
  en: {
    backLink: "← Practical AI for the built environment",
    kickerText: "Biomimicry",
    heroTitle: "Biomimicry",
    heroLead: "Biomimicry page coming next.",
    devNote: "More to come.",
    navBiomimicry: "Biomimicry",
    navProjects: "Projects",
    navAbout: "About",
    navContact: "Contact",
    footerNote: "Biomimicry",
    footerTagline: "Systems-first workflows for architecture and the built environment."
  },
  zh: {
    backLink: "← 建築與環境的實用 AI",
    kickerText: "生物擬態",
    heroTitle: "生物擬態",
    heroLead: "生物擬態頁面建置中。",
    devNote: "內容陸續上線。",
    navBiomimicry: "生物擬態",
    navProjects: "專案",
    navAbout: "關於",
    navContact: "聯絡",
    footerNote: "生物擬態",
    footerTagline: "以系統為先的建築與環境工作流程。"
  }
};
let lang = "en";
function setLang(next) {
  lang = next;
  const t = i18n[lang];
  document.getElementById("langToggle").classList.toggle("is-en-active", lang === "en");
  Object.keys(t).forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.textContent = t[id];
  });
}
document.getElementById("langToggle").addEventListener("click", () => {
  setLang(lang === "en" ? "zh" : "en");
});
document.getElementById("buildVersion").textContent = `Build: ${BUILD}`;
setLang("en");
  </script>
</body>
</html>
